<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vazhe</title>
  <meta name="description" content="Your own English to Persian dictionary.">
  <meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C1119" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">
    <section class="list-pane" aria-label="Your words">
      <header class="brand">
        <span class="mark" aria-hidden="true">و</span>
        <span class="brand-name">Vazhe</span>
        <span class="count" id="count"></span>
      </header>

      <form class="composer" id="add-form" autocomplete="off">
        <label class="sr-only" for="word-input">English word</label>
        <div class="field">
          <svg class="icon field-icon" aria-hidden="true"><use href="icons.svg#i-magnifying-glass"/></svg>
          <input id="word-input" name="word" type="text" inputmode="text" enterkeyhint="go"
                 autocapitalize="off" spellcheck="false" maxlength="60"
                 placeholder="Type or say a word">
          <button class="icon-btn mic" type="button" data-mic-for="word-input" aria-label="Say a word" hidden>
            <svg class="icon" aria-hidden="true"><use href="icons.svg#i-microphone"/></svg>
          </button>
        </div>
        <button class="btn primary" type="submit" id="add-btn">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg>
          <span>Add</span>
        </button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>

      <ul class="word-list" id="word-list"></ul>
      <div class="empty" id="empty" hidden></div>
    </section>

    <main class="detail-pane" id="detail" tabindex="-1">
      <div class="detail-empty">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#i-book-open-text"/></svg>
        <p>Pick a word to see its meanings.</p>
      </div>
    </main>
  </div>

  <dialog class="password" id="password-dialog">
    <form method="dialog" id="password-form">
      <h2>Enter your password</h2>
      <p>This dictionary is private.</p>
      <label for="password-input">Password</label>
      <input id="password-input" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Open dictionary</button>
    </form>
  </dialog>
</body>
</html>
