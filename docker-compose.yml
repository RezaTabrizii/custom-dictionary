# docker compose up -d --build          the app on http://<server>:3000 (put your own https proxy in front)
# docker compose --profile https up -d --build
#                                       also starts Caddy, which gets a free https certificate for DOMAIN
#
# Everything the app saves is in ./data next to this file (dictionary.db, backups/).
services:
  # Makes ./data writable by the app, which runs as user 1000, then exits.
  # Docker creates a missing ./data owned by root, so this runs before every start.
  data-permissions:
    image: alpine:3.20
    user: root
    command: ["chown", "1000:1000", "/data"]
    volumes:
      - ./data:/data
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]

  app:
    build: .
    image: vazhe
    restart: unless-stopped
    init: true
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: 3000
      # Requests from Caddy or a proxy on this server arrive from a private Docker
      # address, so trust those for the real visitor address and https.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
    ports:
      # Set BIND=127.0.0.1 in .env when a proxy on the same server (or Caddy below) serves https.
      - "${BIND:-0.0.0.0}:${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
