name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t vazhe .
      - name: Start it and wait for the health check
        run: |
          docker run -d --name vazhe -p 3000:3000 vazhe
          for i in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' vazhe)" = healthy ] && exit 0
            sleep 2
          done
          docker logs vazhe
          exit 1
