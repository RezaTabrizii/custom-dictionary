# Serves Vazhe through an nginx that already runs on the server, instead of Caddy.
#   1. Replace dict.example.com with your domain, and 3010 with HOST_PORT from .env.
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/vazhe
#      sudo ln -s /etc/nginx/sites-available/vazhe /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   3. Get the https certificate: sudo certbot --nginx -d dict.example.com
server {
    listen 80;
    listen [::]:80;
    server_name dict.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Only the address nginx sees, so visitors can't fake theirs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
